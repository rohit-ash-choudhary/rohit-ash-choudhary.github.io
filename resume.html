<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume — Rohit Ash Choudhary</title>
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="studio.css">
</head>
<body class="reel">
  <div class="aurora" aria-hidden="true"></div>
  <header class="topbar">
    <a class="mark" href="index.html" aria-label="Rohit Ash Choudhary, home">
      <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true">
        <circle cx="16" cy="16" r="11" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="2 3"/>
        <circle cx="16" cy="16" r="2.2" fill="#c8956c"/>
      </svg>
      <span>RA</span>
    </a>
    <button class="menu-btn" id="menu-btn" type="button" aria-expanded="false" aria-controls="menu-panel" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>
  </header>

  <nav class="menu-panel" id="menu-panel" hidden>
    <a href="index.html">01 · Hi</a>
    <a href="index.html#about">02 · About</a>
    <a href="index.html#work">03 · Work</a>
    <a href="index.html#skills">04 · Skills</a>
    <a href="index.html#contact">05 · Contact</a>
    <a href="index.html#resume">06 · Resume</a>
    <a href="products.html">Things I've built</a>
  </nav>

  <main class="resume-page">
    <p class="eyebrow">Resume</p>
    <h1 id="resume-name">Rohit Ash Choudhary</h1>
    <p class="resume-lead" id="resume-title">Backend Engineer</p>
    <div class="resume-actions">
      <a href="#" download class="cta" id="resume-download-btn">
        <span>Download PDF</span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
      <a href="#" class="linkedin-pill" id="experience-linkedin" target="_blank" rel="noopener noreferrer">Roles, dates, and the rest on LinkedIn <span class="arrow" aria-hidden="true">→</span></a>
    </div>

    <section class="resume-block">
      <h2>Experience</h2>
      <div class="timeline" id="experience-timeline"></div>
    </section>

    <section class="resume-block">
      <h2>Tech skills</h2>
      <div class="skill-cloud" id="skills-section"></div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="studio.js"></script>
  <script>
    if (typeof CONFIG !== "undefined") {
      document.getElementById("resume-name").textContent = CONFIG.name;
      document.getElementById("resume-title").textContent = CONFIG.title;

      const experienceLink = document.getElementById("experience-linkedin");
      if (experienceLink && CONFIG.contact && CONFIG.contact.linkedin) {
        experienceLink.href = CONFIG.contact.linkedin;
      }

      if (CONFIG.work && CONFIG.work.length) {
        const timeline = document.getElementById("experience-timeline");
        const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        const parseYm = (value) => {
          const [year, month] = value.split("-").map(Number);
          return { year, month };
        };
        const formatTenure = (job) => {
          const start = parseYm(job.start);
          const now = new Date();
          const end = job.end ? parseYm(job.end) : { year: now.getFullYear(), month: now.getMonth() + 1 };
          const total = (end.year - start.year) * 12 + (end.month - start.month);
          const safeTotal = Math.max(total, 1);
          const years = Math.floor(safeTotal / 12);
          const mos = safeTotal % 12;
          const parts = [];
          if (years) parts.push(years + (years === 1 ? " yr" : " yrs"));
          if (mos) parts.push(mos + (mos === 1 ? " mo" : " mos"));
          const range = months[start.month - 1] + " " + start.year + " — " + (job.end ? months[end.month - 1] + " " + end.year : "Present");
          return { range, duration: parts.join(" ") || "1 mo" };
        };
        const escapeHtml = (value) => String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");

        timeline.innerHTML = CONFIG.work.map((job, index) => {
          const tenure = formatTenure(job);
          const current = !job.end;
          return `
            <article class="timeline-item${current ? " current" : ""}">
              <div class="exp-card">
                <div class="exp-top">
                  <div>
                    <p class="exp-index">${String(index + 1).padStart(2, "0")}</p>
                    <h3>${escapeHtml(job.role)}</h3>
                    <p class="exp-company">${escapeHtml(job.company)}</p>
                  </div>
                  <div class="exp-meta">
                    ${current ? '<span class="now-badge"><span class="dot"></span>Now</span>' : ""}
                    <span class="exp-dates">${tenure.range}</span>
                    <span class="exp-duration">${tenure.duration}${job.location ? " · " + escapeHtml(job.location) : ""}</span>
                  </div>
                </div>
                <ul class="exp-highlights">
                  ${(job.highlights || []).map((item) => `<li>${escapeHtml(item)}</li>`).join("")}
                </ul>
                <div class="tech-tags">
                  ${(job.tags || []).map((tag) => `<span class="tech-tag">${escapeHtml(tag)}</span>`).join("")}
                </div>
              </div>
            </article>
          `;
        }).join("");
      }

      if (CONFIG.resume && CONFIG.resume.pdfPath) {
        const downloadBtn = document.getElementById("resume-download-btn");
        if (downloadBtn) {
          downloadBtn.href = CONFIG.resume.pdfPath;
          downloadBtn.download = CONFIG.resume.pdfPath.split("/").pop() || "resume.pdf";
        }
      }

      if (CONFIG.skillsDetailed) {
        const skills = CONFIG.skillsDetailed;
        const allSkills = []
          .concat(skills.frameworks || [], skills.ai || [], skills.tools || [], skills.databases || [], skills.programming || [], skills.cloudDevOps || [], skills.applicationServers || [])
          .filter((item, index, all) => all.indexOf(item) === index);
        document.getElementById("skills-section").innerHTML = allSkills
          .map((skill) => `<span class="tech-tag">${skill}</span>`)
          .join("");
      }
    }
  </script>
</body>
</html>
